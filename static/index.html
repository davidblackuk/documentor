<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMentor</title>

  <!-- marked.js — Markdown → HTML rendering for the preview pane -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <!-- highlight.js — syntax highlighting for fenced code blocks in the preview.
       href is swapped between the dark/light variant by the theme toggle. -->
  <link id="hljs-theme-link" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <!-- BASIC isn't in the core bundle above; loaded separately so ```basic fences highlight.
       No grammar exists anywhere for Z80 or MC68000 assembly, so those render unstyled. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/languages/basic.min.js"></script>

  <!-- Split.js — drag-to-resize pane dividers (~2 KB) -->
  <script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>

  <!-- Monaco Editor loader — deferred until the editor view is opened -->
  <!-- PDF.js is loaded lazily via dynamic import() in PdfViewerPane.load() -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    Single-page application shell.
    The App class in app.js swaps between #view-dashboard and #view-editor
    by toggling the .active class; everything else is rendered dynamically.
  -->

  <div id="app">
    <!-- ── Dashboard view ──────────────────────────────────────────────── -->
    <div id="view-dashboard" class="view active">

      <header class="app-header">
        <span class="app-title">DocuMentor</span>
        <div class="model-controls">
          <span id="model-status-label" class="model-status-label">Model: checking…</span>
          <button id="btn-load-model"   class="btn btn-primary"   >Load</button>
          <button id="btn-unload-model" class="btn btn-secondary"  >Unload</button>
        </div>
        <button class="btn-theme-toggle" title="Toggle light/dark theme"></button>
      </header>

      <main class="dashboard-main">
        <div class="dashboard-toolbar">
          <h2 class="section-title">In Progress</h2>
          <div class="toolbar-actions">
            <span id="save-point-status" class="save-status"></span>
            <button id="btn-save-point" class="btn btn-secondary"
                    title="Commit and push output/ to its remote">
              Save Point
            </button>
            <button id="btn-scan-selected" class="btn btn-primary" disabled>
              Scan Selected
            </button>
          </div>
        </div>

        <div id="pdf-list" class="pdf-list">
          <div class="loading-placeholder">Loading…</div>
        </div>

        <!-- Unscanned documents — hidden while empty. See
             DashboardView._renderInboxList in app.js. -->
        <div id="inbox-section" class="collapsible-section hidden">
          <div class="dashboard-toolbar">
            <h2 class="section-title">Inbox</h2>
          </div>
          <div id="inbox-list" class="pdf-list"></div>
        </div>

        <!-- Completed documents — hidden while empty. Entries whose PDF has
             been removed from input/ stay listed with actions disabled;
             see DashboardView._renderCompletedList in app.js. -->
        <div id="completed-section" class="collapsible-section hidden">
          <div class="dashboard-toolbar">
            <h2 class="section-title">Completed</h2>
          </div>
          <div id="completed-list" class="pdf-list"></div>
        </div>

        <!-- Scan progress panel — hidden until a scan starts -->
        <div id="scan-progress-panel" class="scan-progress-panel hidden">
          <div class="progress-header">
            <div class="progress-info">
              <span id="progress-filename" class="progress-filename"></span>
              <span id="progress-fraction" class="progress-fraction"></span>
            </div>
            <button id="btn-cancel-scan" class="btn btn-danger" disabled>Cancel</button>
          </div>
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width:0%"></div>
          </div>
          <div id="scan-log" class="scan-log"></div>
        </div>
      </main>
    </div>

    <!-- ── Editor view ─────────────────────────────────────────────────── -->
    <div id="view-editor" class="view">

      <header class="app-header editor-header">
        <button id="btn-back" class="btn btn-ghost">← Dashboard</button>
        <span id="editor-title" class="editor-title"></span>
        <div class="editor-header-actions">
          <span id="save-status" class="save-status"></span>
          <div class="code-block-control">
            <button id="btn-code-block" class="btn btn-secondary" title="Wrap the selected text in a formatted code block">{ } Code</button>
            <div id="code-lang-menu" class="code-lang-menu hidden">
              <button class="code-lang-option" data-lang="c" title="Ctrl+Shift+C">C</button>
              <button class="code-lang-option" data-lang="csharp" title="Ctrl+Shift+3">C#</button>
              <button class="code-lang-option" data-lang="basic" title="Ctrl+Shift+B">BASIC</button>
              <button class="code-lang-option" data-lang="z80" title="Ctrl+Shift+Z">Z80 Assembly</button>
              <button class="code-lang-option" data-lang="m68k" title="Ctrl+Shift+M">MC68000 Assembly</button>
            </div>
          </div>
          <button id="btn-save"   class="btn btn-primary"  >Save</button>
          <span id="publish-status" class="save-status"></span>
          <button id="btn-publish-blog" class="btn btn-secondary"
                  title="Copy this document to the blog repo as a post">
            Publish to Blog
          </button>
          <button id="btn-rescan-page" class="btn btn-secondary">Rescan Page</button>
          <label class="toggle-label">
            <input type="checkbox" id="toggle-sync-scroll" checked />
            Sync Scroll
          </label>
          <button class="btn-theme-toggle" title="Toggle light/dark theme"></button>
        </div>
      </header>

      <div id="editor-panes" class="editor-panes">

        <!-- Pane 1: Markdown editor (Monaco) -->
        <div id="pane-editor" class="pane">
          <div class="pane-header pane-header-bar">
            <div class="pane-title-group">
              <span>Markdown</span>
              <button class="btn-pane-move" data-pane="pane-editor" data-move="left"  title="Move pane left">‹</button>
              <button class="btn-pane-move" data-pane="pane-editor" data-move="right" title="Move pane right">›</button>
            </div>
            <select id="editor-font-size" class="font-size-select">
              <option value="12">12px</option>
              <option value="13">13px</option>
              <option value="14" selected>14px</option>
              <option value="15">15px</option>
              <option value="16">16px</option>
              <option value="17">17px</option>
              <option value="18">18px</option>
              <option value="19">19px</option>
              <option value="20">20px</option>
              <option value="21">21px</option>
              <option value="22">22px</option>
              <option value="23">23px</option>
              <option value="24">24px</option>
              <option value="25">25px</option>
              <option value="26">26px</option>
              <option value="27">27px</option>
              <option value="28">28px</option>
              <option value="29">29px</option>
              <option value="30">30px</option>
              <option value="31">31px</option>
              <option value="32">32px</option>
            </select>
          </div>
          <div id="monaco-container" class="pane-body monaco-container"></div>
        </div>

        <!-- Pane 2: Live preview (marked.js) -->
        <div id="pane-preview" class="pane">
          <div class="pane-header pane-header-bar">
            <div class="pane-title-group">
              <span>Preview</span>
              <button class="btn-pane-move" data-pane="pane-preview" data-move="left"  title="Move pane left">‹</button>
              <button class="btn-pane-move" data-pane="pane-preview" data-move="right" title="Move pane right">›</button>
            </div>
            <select id="preview-font-size" class="font-size-select">
              <option value="12">12px</option>
              <option value="13">13px</option>
              <option value="14" selected>14px</option>
              <option value="15">15px</option>
              <option value="16">16px</option>
              <option value="17">17px</option>
              <option value="18">18px</option>
              <option value="19">19px</option>
              <option value="20">20px</option>
              <option value="21">21px</option>
              <option value="22">22px</option>
              <option value="23">23px</option>
              <option value="24">24px</option>
              <option value="25">25px</option>
              <option value="26">26px</option>
              <option value="27">27px</option>
              <option value="28">28px</option>
              <option value="29">29px</option>
              <option value="30">30px</option>
              <option value="31">31px</option>
              <option value="32">32px</option>
            </select>
          </div>
          <div id="preview-body" class="pane-body preview-body"></div>
        </div>

        <!-- Pane 3: PDF viewer (PDF.js) -->
        <div id="pane-pdf" class="pane">
          <div class="pane-header pdf-pane-header">
            <div class="pane-title-group">
              <span>PDF</span>
              <button class="btn-pane-move" data-pane="pane-pdf" data-move="left"  title="Move pane left">‹</button>
              <button class="btn-pane-move" data-pane="pane-pdf" data-move="right" title="Move pane right">›</button>
            </div>
            <div class="pdf-indicators">
              <button id="btn-crop" class="btn btn-secondary" title="Drag a rectangle on the PDF to save it as an image">⬚ Crop</button>
              <span id="pdf-page-indicator" class="pdf-page-indicator"></span>
              <span id="pdf-scroll-percent" class="pdf-scroll-percent"></span>
            </div>
          </div>
          <div id="pdf-body" class="pane-body pdf-body"></div>
        </div>

      </div>

      <!-- Rescan overlay — shown while a single-page rescan is running -->
      <div id="rescan-overlay" class="rescan-overlay hidden">
        <div class="rescan-spinner"></div>
        <span id="rescan-message" class="rescan-message">Rescanning page…</span>
      </div>

      <!-- Unsaved-changes confirmation — shown when leaving the editor with pending edits -->
      <div id="unsaved-overlay" class="confirm-overlay hidden">
        <div class="confirm-box">
          <p class="confirm-message">You have unsaved changes. Save before leaving?</p>
          <div class="confirm-actions">
            <button id="btn-unsaved-cancel"  class="btn btn-ghost">Cancel</button>
            <button id="btn-unsaved-discard" class="btn btn-danger">Discard Changes</button>
            <button id="btn-unsaved-save"    class="btn btn-primary">Save &amp; Exit</button>
          </div>
        </div>
      </div>

      <!-- Toast — brief confirmation/error messages, e.g. after a crop-to-image save -->
      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
