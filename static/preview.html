<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMentor — Preview</title>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <link id="hljs-theme-link" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/languages/basic.min.js"></script>

  <link rel="stylesheet" href="style.css" />
  <style>
    /* This page has no Split.js panes, just a single scrollable column. */
    body { overflow-y: auto; }
    .preview-page-header {
      position: sticky;
      top: 0;
      height: var(--header-h);
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 10;
    }
    .preview-page-title {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-page-body { max-width: 900px; margin: 0 auto; }
  </style>
</head>
<body>
  <header class="preview-page-header">
    <a href="/" class="btn btn-ghost">← Dashboard</a>
    <span id="preview-page-title" class="preview-page-title"></span>
    <select id="preview-version-select" class="font-size-select" title="View a prior saved version"></select>
    <button class="btn-theme-toggle" title="Toggle light/dark theme"></button>
  </header>

  <div id="preview-body" class="preview-body preview-page-body">
    <div class="loading-placeholder">Loading…</div>
  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
