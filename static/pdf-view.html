<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMentor — PDF</title>

  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .preview-page-header {
      height: var(--header-h);
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .preview-page-title {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #pdf-frame { flex: 1; width: 100%; border: none; }
  </style>
</head>
<body>
  <header class="preview-page-header">
    <a href="/" class="btn btn-ghost">← Dashboard</a>
    <span id="preview-page-title" class="preview-page-title"></span>
    <button class="btn-theme-toggle" title="Toggle light/dark theme"></button>
  </header>

  <iframe id="pdf-frame"></iframe>

  <script type="module" src="pdf-view.js"></script>
</body>
</html>
